id: agent/task-tracking
domain: agent
title: The task.md / implementation_plan.md bookkeeping protocol
status: active
summary: >
  update_task parses the checkbox items of task.md, selects exactly one item by
  index or unique substring, and drives the loop: list progress, start an item,
  tick one verified plan step, mark the item done and reset implementation_plan.md
  for the next item. The plan moves as soon as a step is proven, so it stays a live
  record; ambiguous or unknown selections are refused without touching either file,
  and both files are written through verified atomic writes.
code:
  - path: tools/update_task.js
    symbols: [parseTaskItems, readTaskStatus, findTaskItem, markItemDone, nextPendingItem, renderPlan, definition, execute]
  - path: utils/plan-file.js
    symbols: [CHECKBOX_PATTERN, STATUS_PATTERN, parseCheckboxItems, parsePlanSteps, findCheckboxItem, findPlanStep, markCheckboxItem, markPlanStepDone, readStatusLine, replaceStatusLine, planProgress, renderPlan]
  - path: config/constants.js
    symbols: [TASK_FILE, PLAN_FILE]
tests:
  - path: tests/harness-tools.test.js
    cases:
      - parseTaskItems/markItemDone handle the task.md checkbox syntax
      - renderPlan produces a resetable implementation_plan.md body
      - update_task marks an item done, advances, and resets the plan
      - update_task refuses ambiguous or unknown items without touching the files
      - update_task reports a done task when nothing is pending
  - path: tests/task-plan-progress.test.js
    cases:
      - parsePlanSteps reads the checkbox syntax of the plan
      - parsePlanSteps ignores the prose and the headings of a plan
      - findPlanStep selects one step by index or by unique substring
      - markPlanStepDone ticks one line in place and leaves the rest byte-identical
      - planProgress and the status line summarise the plan
      - the plan is reset for an item and its steps tick as they are verified
      - the plan moves while the item is still in flight
      - ticking the last step marks the plan status done
      - ticking a step refuses an unknown, ambiguous or already-ticked step
      - a missing plan file is reported instead of created
      - update_task list reports the plan progress
      - an unknown action is still refused, and renderPlan stays exported here
      - completing an item still moves the plan on to the next one
