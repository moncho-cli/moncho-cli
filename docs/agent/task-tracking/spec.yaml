id: agent/task-tracking
domain: agent
title: The task.md / implementation_plan.md bookkeeping protocol
status: active
summary: >
  Each conversation owns its checklist and plan under its own session folder
  (agent/sessions/<id>/task.md and implementation_plan.md), written in one canonical
  shape — title, "status:" line, one column-0 "- [ ]" section — by the single tool
  that authors them. update_task selects exactly one item by index or unique
  substring and drives the loop: list progress, start an item, tick one verified
  plan step, mark the item done and reset the plan for the next one; the plan moves
  as soon as a step is proven. Ambiguous or unknown selections are refused without
  touching either file, both files are written through verified atomic writes, and
  the generic writers stay out of the way: a write_file draft is re-rendered in the
  canonical shape, while a patch into a re-rendered document is refused outright.
code:
  - path: utils/tracking-store.js
    symbols: [TRACKING_FILE_NAMES, trackingPaths, readTaskContent, readPlanContent, writeTaskContent, writePlanContent, ensureTrackingFiles]
  - path: utils/tracking-format.js
    symbols: [TASK_TITLE, PLAN_TITLE, ITEMS_HEADING, STEPS_HEADING, NOTES_HEADING, STATUS_STATES, isCanonicalStatus, normalizeStatus, readTitle, extractNotes, entriesOf, trackingTemplate, renderTaskFile, renderPlanFile, validateTrackingFile, canonicalizeTrackingFile]
  - path: utils/tracking-fence.js
    symbols: [TOOL_OWNED_FILES, TRACKING_TOOL, TRACKING_FILE_REFUSAL, TRACKING_LOCATION_REFUSAL, isToolOwnedFile, isSessionTrackingPath, toolOwnedKind, canonicalTrackingWrite, trackingFenceRefusal, trackingLocationRefusal]
  - path: utils/tracking-step.js
    symbols: [refusal, completeStep]
  - path: tools/update_task.js
    symbols: [parseTaskItems, readTaskStatus, findTaskItem, markItemDone, nextPendingItem, renderPlan, definition, execute]
  - path: tools/write_file.js
    symbols: [definition, execute]
  - path: utils/plan-file.js
    symbols: [CHECKBOX_PATTERN, STATUS_PATTERN, parseCheckboxItems, parsePlanSteps, findCheckboxItem, findPlanStep, markCheckboxItem, markPlanStepDone, readStatusLine, replaceStatusLine, planProgress, renderPlan]
  - path: utils/session-store.js
    symbols: [sessionDir]
  - path: config/constants.js
    symbols: [TASK_FILE, PLAN_FILE]
tests:
  - path: tests/tracking-store.test.js
    cases:
      - a registered session owns a folder, and the files live in it
      - ensureTrackingFiles gives a session its own canonical pair
      - the session copy answers only when its file is gone
      - a write lands in the session file and in the record snapshot
      - update_task reads and writes the checklist of its own session
      - a root task.md is neither read as a checklist nor rewritten
      - without a session there is no store, so the project root is never one
      - seeding is a session affair, so it never creates the root pair
  - path: tests/tracking-format.test.js
    cases:
      - the canonical status is one of three states, with the item in flight named
      - renderTaskFile writes the whole document, from whatever parts it is given
      - renderPlanFile titles the plan with the item it is the plan for
      - validateTrackingFile reports each broken rule instead of throwing
      - a legacy file is upgraded, not rejected, so an operator keeps working
      - the human parts of a file survive the upgrade
      - a wrapped entry keeps its whole text through a re-render
      - a note is never folded into the item above it
      - the template the model is shown is the shape the renderer really writes
      - the prompt tells the agent to record a decision as it is agreed
      - the prompt states the tracking rule without teaching a session path
  - path: tests/tracking-fence.test.js
    cases:
      - the fence recognises a tracking file by name, in any folder
      - a tracking file lives one session folder deep, and nowhere else
      - a write_file draft is normalised instead of stored verbatim
      - write_file stores the canonical document when it is handed a checklist
      - write_file refuses to create a tracking file at the project root
      - write_file leaves an ordinary file byte-for-byte alone
      - a pasted diff into a tracking file is refused, and names the tool to use
      - a stray root copy of a tracking file is refused too, and never created
      - the same diff still patches an ordinary file
  - path: tests/harness-tools.test.js
    cases:
      - parseTaskItems/markItemDone handle the task.md checkbox syntax
      - renderPlan produces a resetable implementation_plan.md body
      - update_task marks an item done, advances, and resets the plan
      - update_task refuses ambiguous or unknown items without touching the files
      - update_task reports a done task when nothing is pending
  - path: tests/task-plan-progress.test.js
    cases:
      - parsePlanSteps reads the checkbox syntax of the plan
      - parsePlanSteps folds a wrapped entry into the one entry it is
      - parsePlanSteps ignores the prose and the headings of a plan
      - findPlanStep selects one step by index or by unique substring
      - markPlanStepDone ticks one line in place and leaves the rest byte-identical
      - planProgress and the status line summarise the plan
      - the plan is reset for an item and its steps tick as they are verified
      - the plan moves while the item is still in flight
      - ticking the last step marks the plan status done
      - ticking a step refuses an unknown, ambiguous or already-ticked step
      - a missing plan file is reported instead of created
      - update_task list reports the plan progress
      - an unknown action is still refused, and renderPlan stays exported here
      - completing an item still moves the plan on to the next one
