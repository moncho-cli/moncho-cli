id: agent/tool-multicall
domain: agent
title: One tool batch — five simultaneous calls, one signature-annotated envelope
status: active
summary: >
  The tool calls of one assistant message form a batch: planToolBatch() accepts
  the first MAX_PARALLEL_TOOL_CALLS (5) by position and refuses the rest,
  dispatchToolCalls() runs the accepted calls simultaneously and returns their
  outcomes in call order, and handleToolBatch() stores one tool chunk per call —
  the intent first, then the result inside a `<tool-multicall result calls=N>`
  envelope whose `<tool-call name="…">` element carries the call signature built
  by formatCallSignature(). A refused call is answered with a structured
  TOO_MANY_TOOL_CALLS body, a throwing or unknown tool is an error outcome, an
  aborted task skips its calls, and parseToolChunk() unwraps the envelope while
  still reading a chunk written before it existed. Before anything runs, every
  call passes the injected pre-dispatch gate (app/tool-guard.js): a gate answer
  becomes a structured refusal instead of an invocation, and no gate leaves the
  batch exactly as it was.
code:
  - path: app/tool-batch.js
    symbols: [formatBatchRefusal, planToolBatch, dispatchToolCalls, formatBatchLine, handleToolBatch]
  - path: app/tool-guard.js
    symbols: [allowAllGate, guardToolCall, formatGuardRefusal, TOOL_GUARD_REFUSAL]
  - path: app/tool-call-format.js
    symbols: [formatArgType, formatCallSignature, MULTICALL_FOOTER, formatMulticallHeader, formatMulticallEnvelope, parseMulticallEnvelope, formatToolResultChunk, parseToolChunk, normalizeToolCall, formatCallLines]
  - path: config/constants.js
    symbols: [MAX_PARALLEL_TOOL_CALLS, TOO_MANY_TOOL_CALLS, TOO_MANY_TOOL_CALLS_GUIDANCE]
  - path: app/conversation-manager.js
    symbols: [ConversationManager]
tests:
  - path: tests/tool-multicall.test.js
    cases:
      - "formatCallSignature() summarises the tool name and the type of each parameter"
      - "the multicall envelope wraps a result and reads it back byte-for-byte"
      - "parseToolChunk() reads an enveloped chunk and a pre-envelope chunk the same way"
      - "a body that quotes the envelope still round-trips"
      - "an enveloped tool chunk replays as the plain body it wrapped"
  - path: tests/tool-batch.test.js
    cases:
      - "planToolBatch() accepts the first five calls and refuses the rest in order"
      - "a batch is dispatched simultaneously and its outcomes keep the call order"
      - "a throwing tool and an unknown tool become error outcomes, never failures"
      - "an aborted task skips the calls instead of starting them"
      - "the loop stores one enveloped chunk per call, in call order"
      - "a call beyond the cap is answered with a structured TOO_MANY_TOOL_CALLS refusal"
      - "handleToolCalls() batches the calls of one assistant message"
  - path: tests/tool-guard.test.js
    cases:
      - "guardToolCall() allows every call when no gate is installed"
      - "guardToolCall() turns a gate answer into a structured refusal"
      - "a gate that throws fails closed instead of running the tool"
      - "formatGuardRefusal() names the tool, the mode and the reason"
      - "dispatchToolCalls() refuses a gated call without invoking the tool"
      - "without a gate the batch runs every accepted call, as before"
      - "handleToolBatch() stores a refusal as the tool chunk of the refused call"