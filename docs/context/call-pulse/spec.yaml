id: context/call-pulse
domain: context
title: A model-call pulse on every agent request, with a hard limit and two resets
status: active
summary: >
  The host counts the agent model calls of the current stretch of work against a
  configurable hard limit defaulting to 30. The line itself is paused: a message
  generated per call defeats provider prompt caching, so formatPulseText() answers
  the empty string and createTaskPulse().message() answers null, which is what keeps
  an empty system message out of the request (ContextWindow.request() drops it with
  its own filter(Boolean)). The counter keeps running, is never a window chunk, and
  is never enforcing — the host only raises one transient notice the first time a
  call goes past the cap. It resets to 0 when a task.md item is completed through
  update_task, and when a compaction rewrote the window; the summariser call does
  not tick it.
  With the line paused every agent request is the agent prompt followed by the
  conversation and nothing else, so a later call repeats the earlier one
  byte-for-byte and only appends — the prefix a provider caches stays stable.
code:
  - path: utils/task-pulse.js
    symbols: [PULSE_MARKER, PULSE_RESET_REASONS, normalizePulseLimit, formatPulseText, formatPulseLimitNotice, createTaskPulse]
  - path: app/conversation-manager.js
    symbols: [ConversationManager]
  - path: app/context-window.js
    symbols: [ContextWindow]
  - path: app/compaction-runner.js
    symbols: [createCompactionRunner, createSummaryCallModel]
  - path: utils/host.js
    symbols: [registerTaskPulse, getTaskPulse, resetTaskPulse, clearTaskPulse]
  - path: tools/update_task.js
    symbols: [parseTaskItems, markItemDone, renderPlan]
  - path: config/constants.js
    symbols: [PULSE_LIMIT, PULSE_LIMIT_DEFAULT]
  - path: api/ollama.js
    symbols: [callOllama, normalizeUsage]
tests:
  - path: tests/call-pulse.test.js
    cases:
      - "normalizePulseLimit defaults to 30 and refuses what is not a positive integer"
      - "formatPulseText is disabled so a request carries no extra line"
      - "formatPulseText stays disabled past the hard limit as well"
      - "formatPulseLimitNotice says what happened and what to do about it"
      - "createTaskPulse counts calls, reports the first crossing once, and resets with a reason"
      - "the pulse message is null while the line is disabled, so no empty system message is sent"
      - "the shipped prompt carries the pulse behaviour, not the pulse machinery"
  - path: tests/call-pulse-loop.test.js
    cases:
      - "no agent request carries a pulse line or an empty system message while it is disabled"
      - "the summariser call is not an agent call and does not carry or tick the pulse"
      - "the pulse counts calls and warns once past the hard limit without refusing them"
      - "the request prefix never changes between agent calls, so the prompt cache can be hit"
      - "completing a task.md item resets the live pulse through the host registry"
      - "resetTaskPulse reaches the live pulse and refuses an empty registry"
