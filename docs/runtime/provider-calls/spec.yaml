id: runtime/provider-calls
domain: runtime
title: Single model entry point, normalised shapes, retries and abort
status: active
summary: >
  callOllama() posts to the configured provider, injecting the agent system prompt
  unless explicitly disabled, and normalises both the Ollama and OpenAI response
  shapes (including tool calls) to one message object. Failures are retried up to
  three times unless the abort signal is set, and the signal is passed to fetch. A
  retried attempt is reported through the injected onRetry hook so the host can show
  it as a transient notice instead of a permanent transcript line
  (docs/interface/notice-overlay). detectProvider/describeModel derive the provider
  identity from the base URL.
code:
  - path: api/ollama.js
    symbols: [callOllama, projectLanguageGuidance]
  - path: api/provider-response.js
    symbols: [normalizeUsage, normalizeResponse]
  - path: config/constants.js
    symbols: [BASE_URL, API_KEY, MODEL, MODEL_TEMPERATURE, THINKING_FILE, detectProvider, describeModel, PROVIDER]
tests:
  - path: tests/ollama-provider.test.js
    cases:
      - detectProvider maps common base URLs (task.md item 5)
      - describeModel reports the configured provider and model
      - a default call injects the agent system prompt and normalises the response
      - project language guides artifacts without dictating conversation language
      - a configured MODEL_TEMPERATURE reaches the request body
      - systemPrompt:false omits the agent prompt (used by the context summariser)
      - the abort signal is honoured
      - a retried attempt is reported through onRetry, not the console
      - a throwing onRetry hook never costs the retry
      - the thinking capture resolves inside the project, and refuses to leave it
  - path: tests/model-temperature.test.js
    cases:
      - MODEL_TEMPERATURE is unset unless the user configures one
      - an out-of-range or unparseable MODEL_TEMPERATURE reads as unset
      - a usable MODEL_TEMPERATURE is kept as a number, boundary values included
      - an unset MODEL_TEMPERATURE leaves the key out of the request body
