id: runtime/session-version
domain: runtime
title: Which version is running, and which sessions it may open
status: active
summary: >
  A conversation is written by one build of the agent, and two builds are not
  interchangeable in every direction: a newer runtime may read a record shape an older one
  cannot, and a tool contract may have moved. So every session records the version that
  last wrote it, and the pin is judged by compatibility era rather than by equality of the
  two strings. Ordering decides the door: a pin newer than the running build is refused
  always, because there is no un-migration once the newer build has written these bytes,
  and no break table can open that row. An older pin opens while nothing between the two
  versions declares a break, and is carried forward where a migration exists — the era
  table and its migrations are their own spec (docs/runtime/session-compat). A record
  written before the pin existed carries none, and that is a separate answer from a
  refusal: null means nobody has claimed the conversation, so any runtime may open it and
  the next save stamps it, because treating a missing pin as a mismatch would strand every
  session already on disk. The refusal names the pinned version and the exact command that
  opens it, telling apart a pin newer than this build from one stranded across a break with
  no migration, because a message that only says "wrong version" is a dead end. The running
  version comes from the runner (MONCHO_VERSION), which is the thing that chose which
  installed payload to mount, and falls back to the manifest the build ships for a checkout
  run through ./start.sh.
code:
  - path: utils/session-version.js
    symbols: [runningVersion, sessionVersion, sessionVerdict, canOpenSession, sessionVersionRefusal, upgradedPin, DECLARED_VERSION, VERSION_ENV]
  - path: utils/session-format.js
    symbols: [serializeSession, sessionMonchoVersion]
  - path: utils/session-move.js
    symbols: [moveSession]
  - path: app/upgrade-command.js
    symbols: [upgradeCommand]
  - path: app/session-loop.js
    symbols: [handleCommand, runSessionLoop]
tests:
  - path: tests/session-version.test.js
    cases:
      - the running version comes from the runner and falls back to the manifest
      - a session with no pin is openable and is stamped by the next save
      - a session pinned to the running version opens
      - a newer pin is refused, and the refusal names the command that opens it
      - the pin is judged by era, so an older session opens and a newer one is refused
      - an upgrade rewrites the claim so the old version refuses it afterwards
      - the audit line records where an upgrade came from and when
      - /sessions refuses a locked session before touching the conversation
      - /sessions opens a session written by the running version
      - the picker marks a locked row and still lists it
      - the picker refuses the locked row it was told to open
      - an unpinned session still opens, and the next save claims it
      - a move carries every file the session owns, and leaves the old id empty
      - a moved session sorts first, so --continue finds it
      - a move refuses to overwrite a session that already sits at the new id
      - a move of a session that is not there says so instead of creating one
      - /upgrade moves the session, pins it to the running version and asks to close
      - /upgrade re-pins a session this build may read and refuses one it may not
      - /upgrade on a session already at the running version is a no-op
      - /upgrade refuses an argument and a front end with no session
  - path: tests/session-loop.test.js
    cases:
      - runSessionLoop() ends on a command that asks to close, saving through the same path as exit
