id: interface/tui
domain: interface
title: Full-screen TUI layout, rendering and feedback
status: active
summary: >
  With a pty, createTui() builds a blessed screen (input box, queue bar, status
  bar, the working-time row above it, model row, scrollable transcript) and returns
  null without one so the line CLI is kept. Model text is sanitised and escaped
  before rendering, long pastes collapse and expand byte-for-byte through a paste
  table, the status bar carries the status or spinner on the left and the context
  meter pinned to its right edge (always visible), the row above it carries the
  working-time counter right-aligned through the same composer
  (docs/context/working-time), compactions are announced in the transcript exactly
  once, and the keys are bound apart from the screen wiring (interrupts on the
  program, scrolling on the screen, Tab and Shift+Tab on the program so the tab byte
  never reaches the input box). The queue bar right above the input box is the
  pending-message region (docs/interface/message-queue). An input box with no text
  shows the last prompt over it, greyed out (app/input-hint.js, task-backlog: "if
  the input box is empty, it should have a grayed italic text saying 'Last prompt:
  .......'"); the hint is display only — content, never value — and disappears with
  the first typed character.
