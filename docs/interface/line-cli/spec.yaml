id: interface/line-cli
domain: interface
title: Line-based CLI fallback and its exit() contract
status: active
summary: >
  createCLI() exposes { rl, question, exit, choose, close } on readline. question()
  arms a single pending question; exit() settles it with the 'exit' sentinel (the
  same value the host loop reads as the user typing exit) and reports false when
  nothing is armed; choose() prints a numbered list and reads the number back, the
  line-CLI counterpart of the TUI picker modal. The TUI mirrors this surface so the
  host loop is front-end agnostic. There is no queue bar here: readline buffers what
  is typed while a turn runs, and nextPrompt() is called without a dequeue, so the
  front end is the only source of prompts (docs/interface/message-queue).
code:
  - path: app/cli.js
    symbols: [createCLI]
  - path: main.js
    symbols: [main]
tests:
  - path: tests/interrupt-controls.test.js
    cases:
      - "createCLI().exit() settles the pending question with the exit sentinel"
      - "TUI: exit() resolves an armed question with the exit sentinel"
