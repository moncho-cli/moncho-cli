id: interface/message-queue
domain: interface
title: Sending messages while a turn is in flight, and deleting them from the queue
status: active
summary: >
  A message typed while a request is in flight is queued instead of going nowhere:
  the input box stays armed for the whole turn (app/prompt-input.js), the submission
  is stored FIFO and verbatim (paste tags expanded back) in a pure model
  (app/message-queue.js), the rows are painted with a ✕ each in a region right above
  the input box that shifts the status bar, the model row and the transcript up by
  the queue height (app/queue-bar.js, app/tui-layout.js#setQueueHeight), and a click
  on a row deletes that message only. The queue is drained at two points that share
  one rule (takeQueued/takeQueuedPrompt, app/message-queue.js): between two turns
  through nextPrompt(), and mid-turn at the top of the turn loop's per-call loop
  (app/turn-runner.js#runTurn), so a message queued while a turn is running steers the
  work without waiting for the turn to end. Neither point drains inside a tool chain,
  so an injected message can never split an assistant tool_calls message from its tool
  results, and the injected text is an ordinary user prompt (one chunk, the same echo,
  the autosave event and the meter). The whole queue is handed over as one prompt
  (nextPrompt() plus joinQueued()), so several notes typed during one turn are
  addressed together in a single turn instead of one turn each, oldest first and
  separated by a blank line; a queue of one crosses byte-for-byte. Every painted row
  is fitted to the interior width of the bar it is drawn in, so a long message uses
  the whole of a wide terminal and stays one display line that is never clipped
  (app/queue-rows.js); a caller with no width — the line CLI, which has no bar — keeps
  the fallback preview cap. The line CLI has no queue bar and keeps readline's own
  buffering.
code:
  - path: app/message-queue.js
    symbols: [createMessageQueue, nextPrompt, joinQueued, queueRowAt, takeQueued, takeQueuedPrompt]
  - path: app/queue-rows.js
    symbols: [displayWidth, truncateToWidth, queuePreviewBudget, previewMessage, formatQueueRow, formatQueueRows, formatQueueTail, QUEUE_PREVIEW_CHARS, QUEUE_MAX_ROWS, QUEUE_DELETE_MARKER]
  - path: app/queue-bar.js
    symbols: [createQueueBar, queueSurface]
  - path: app/prompt-input.js
    symbols: [createPromptInput, normalizePrompt]
  - path: app/tui-layout.js
    symbols: [createLayout, setQueueHeight, QUEUE_BOTTOM]
  - path: app/tui.js
    symbols: [createTui]
  - path: app/turn-runner.js
    symbols: [runTurn]
  - path: app/session-loop.js
    symbols: [runSessionLoop]
  - path: app/conversation-manager.js
    symbols: [ConversationManager]
  - path: main.js
    symbols: [main]
tests:
  - path: tests/message-queue.test.js
    cases:
      - "createMessageQueue() keeps messages in FIFO order, verbatim"
      - "createMessageQueue() notifies its subscribers on every change"
      - "createMessageQueue() removes one message by id and clears the rest"
      - "queueRowAt() maps a click to the message under the cursor"
      - "nextPrompt() injects the oldest queued message between turns, else asks"
      - "nextPrompt() drains every waiting message as one prompt, in order"
      - "nextPrompt() hands a single queued message over byte-for-byte"
      - "nextPrompt() keeps the single-message drain for a front end without a batch"
      - "joinQueued() keeps one message verbatim and separates several by a blank line"
      - "drainAll() empties the queue in one notification, oldest first"
      - "takeQueued() is the one drain rule both injection points share"
      - "takeQueuedPrompt() joins a drain the one way a prompt is made"
      - "nextPrompt() drains through the shared rule, byte-for-byte"
  - path: tests/turn-runner-inject.test.js
    cases:
      - "a message queued mid-turn is injected before the next call, not after the turn"
      - "the injection never splits an assistant tool_calls message from its tool results"
      - "the injected message is echoed to the transcript as the user side of the dialogue"
      - "injecting announces the conversation change, so the record is written mid-turn"
      - "a queue that is empty, absent, or throws changes nothing about the turn"
      - "a steer is a new message, so the model owes it a seed of its own"
  - path: tests/queue-rows.test.js
    cases:
      - "displayWidth() and truncateToWidth() count cells, not characters"
      - "queuePreviewBudget() spends the width on the preview, keeping the marker"
      - "previewMessage() flattens whitespace and truncates long text"
      - "formatQueueRow() fits a long message to the width the row really has"
      - "formatQueueRows() paints one row per message, fitted and capped by maxRows"
  - path: tests/message-queue-tui.test.js
    cases:
      - "a submission while a request is in flight is queued, and shown above the input box"
      - "the box stays armed after a queued submission, so the next keystroke lands"
      - "the queued text is verbatim, and the queue drains in order between turns"
      - "the surface drains the whole queue at once, so a batch is one prompt"
      - "a click on a ✕ row deletes that message only, and the region shrinks back"
      - "a message typed while idle is not queued: the box settles the armed question"
      - "a long queued message uses the whole bar and is never wrapped or clipped"
      - "a slash command submitted mid-turn is answered, never queued"
  - path: tests/tui.test.js
    cases:
      - "a pty gets the three-region TUI (transcript, status bar, input box)"
      - "the queue bar shifts the regions above it up by its height"
      - "a mid-session resize keeps the layout and repaints"
