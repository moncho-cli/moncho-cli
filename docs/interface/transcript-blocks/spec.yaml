id: interface/transcript-blocks
domain: interface
title: Collapsible tool output in the transcript
status: active
summary: >
  The transcript is a model of plain lines and collapsible blocks. Every block starts
  collapsed — one header line carrying its "X char response" size, whatever the size
  of the payload and a one-word result included — and a click expands it, the next
  click collapses it; the payload is kept verbatim and the scroll position survives
  the toggle. A caller may ask for `collapsed: false`, which is reserved for an
  announcement (a tracking block, the design review) and never for a tool response.
code:
  - path: app/transcript.js
    symbols: [TranscriptModel, COLLAPSED_MARKER, EXPANDED_MARKER, formatCharCount, formatBlockHeader, blockLines, clickRow, blockAtClick]
  - path: app/transcript-view.js
    symbols: [createTranscriptView]
  - path: app/tui-render.js
    symbols: [formatTranscript]
tests:
  - path: tests/transcript-blocks.test.js
    cases:
      - "the transcript model collapses a block and keeps the payload verbatim"
      - "every block starts collapsed, whatever its size"
      - "plain lines and blocks keep their order and their line ranges"
      - "clickRow() and blockAtClick() map a screen click onto a block"
      - "a tool result is collapsed by default and says \"X char response\" inline"
      - "clicking a collapsed tool result expands it, clicking again collapses it"
      - "a click on a plain transcript line toggles nothing"
      - "the collapsed header keeps the size label right after the intent"
      - "expanding a block keeps the transcript scroll position"
      - "formatBlockHeader()/blockLines() describe the header a block paints"
