id: interface/commands
domain: interface
title: Slash commands and the selection picker
status: active
summary: >
  Input starting with /<name> is answered by an iterable command registry instead
  of being sent to the model. /sessions lists the stored conversations and resumes
  one through a picker (a modal in the TUI, a numbered list in the line CLI), and
  /help is derived from the registry itself. /usage prints the per-model token
  table (`docs/context/model-usage`). The picker's navigation rules are a pure
  model, so they are tested without a terminal.
  /work on|off is the execution lock (`docs/interface/modes`): it refuses a session
  with no task.md or with every item done, and releasing it lands on Design.
  /compact is the compaction the *user* asks for: a bare /compact runs the ordinary
  budget check and reports WITHIN_BUDGET when the window still fits, /compact force
  overrides it, and a completed compaction restarts the model-call pulse
  (`docs/context/call-pulse`). It drives ConversationManager#maybeCompact(), so the
  summary call stays with the manager that owns the provider connection.
  /new starts a fresh conversation in place: it empties the window, the accounting table
  and the pulse, and reports NEW_SESSION so the host rotates the recorder to a new id,
  re-seeds the tracking files and empties the view, leaving the previous conversation on
  disk for /sessions.
code:
  - path: app/commands.js
    symbols: [createCommandRegistry, parseCommand, createDefaultCommands, helpCommand, sessionsCommand, usageCommand, runCommand]
  - path: app/new-command.js
    symbols: [newCommand]
  - path: app/session-recorder.js
    symbols: [createSessionRecorder]
  - path: app/compact-command.js
    symbols: [compactCommand, FORCE_ARG]
  - path: app/work-command.js
    symbols: [workCommand, readTaskItems]
  - path: utils/usage-stats.js
    symbols: [formatUsageRows, normalizeModelUsage]
  - path: app/picker.js
    symbols: [createPicker, DEFAULT_PAGE_SIZE]
  - path: app/tui-modal.js
    symbols: [createPickerModal, chooseLabel]
  - path: app/cli.js
    symbols: [createCLI]
  - path: main.js
    symbols: [main]
tests:
  - path: tests/commands.test.js
    cases:
      - "parseCommand() recognises /<name> <arg> and leaves prompts alone"
      - "the command registry is iterable code, not a hard-coded switch"
      - "the default registry ships /work, /new, /sessions, /usage, /compact, /skins, /task, /ref and /help, and /help lists them"
      - "/sessions with no stored session says so and changes nothing"
      - "/sessions lists the stored conversations when there is no picker"
      - "/sessions opens the picker and resumes the chosen conversation"
      - "/sessions cancels cleanly, and refuses an unknown id or a broken file"
      - "/sessions <id> resumes directly, without a picker"
      - "createPicker() keeps the cursor in view and wraps at the ends"
      - "createPicker() handles an empty list without throwing"
  - path: tests/new-command.test.js
    cases:
      - "/new ships in the default registry, so the user can type it"
      - "/new empties the live window, the accounting table and the pulse"
      - "/new refuses an argument and a front end with no window"
      - "handleCommand() rotates the session identity to a brand-new id"
      - "a line CLI without reload() still empties the window and prints the result"
  - path: tests/compact-command.test.js
    cases:
      - "/compact runs the ordinary budget check and reports a window that still fits"
      - "/compact force overrides the budget and restarts the pulse"
      - "/compact over a window with nothing to compact says so instead of failing"
      - "/compact refuses a front end without a window, an unknown argument and a failed compaction"
      - "/compact ships in the default registry, so the user can type it"
  - path: tests/tui-modal.test.js
    cases:
      - "the picker modal opens, navigates and resolves with the chosen index"
      - "the modal cancels with Escape and with Ctrl+C, returning null"
      - "the modal wraps at the ends and jumps with home/end"
      - "a picker with no rows cancels instead of resolving nonsense"
      - "closing the picker modal leaves the input box reading a keystroke once"
  - path: tests/work-command.test.js
    cases:
      - "/work on refuses a session with no task.md, and the mode does not move"
      - "/work on refuses an empty checklist and one whose items are all done"
      - "/work on locks the session to Work and names the next item in line"
      - "/work off releases the lock and falls back to Design"
      - "/work with no argument reports the state, and an unknown argument is refused"
      - "a front end with no session mode is refused instead of throwing"
      - "/work reaches the live mode through the registry context"
  - path: tests/session-loop.test.js
    cases:
      - "handleCommand() hands the live session mode to a command, so /work moves the gate state"
      - "handleCommand() restores the stored mode of a resumed session, the lock included"
      - "handleCommand() leaves the mode alone when the session file stored none"
