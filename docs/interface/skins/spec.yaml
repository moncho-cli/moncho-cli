id: interface/skins
domain: interface
title: Per-project colour skins, applied live, and the /skins prompt and customize modal subchats
status: active
summary: >
  A skin is a saved look — the conversation palette (app/theme.js) plus the presentation
  tokens (border, brand line, input hint, the two bolds) — kept as one JSON file per name
  under agent/skins/<name>.json (utils/skins-store.js), so the look of a project travels
  with the project and never with the session. Every colour is a blessed colour *name*,
  never a hex code, because a character-cell terminal addresses named colours; the
  built-in default is the palette the project already ships, so a project with no skin file
  looks exactly as it always did, and normalizeSkin() degrades an unknown key or a bad
  colour to the shipped one instead of breaking the session. The palette and the tokens are
  live. Nothing but app/paint-tags.js turns a colour into a blessed tag: a paint site names a
  palette key ({@frame-fg}) and resolveTags() substitutes the live value at paint time, so an
  unknown key or an unpaintable name degrades to the default rather than reaching the screen as
  a literal tag. A model proposal is validated strictly (validateProposal()) and refused with
  the reason, where normalizeSkin() would have silently degraded it.
  CONVERSATION_COLORS, SLASH_COLORS and THEME_TOKENS keep their names and defaults
  but are no longer frozen, and setPalette()/setTokens()/applySkin()/resetTheme() mutate
  them in place, so a skin repaints a running transcript without re-importing anything;
  every consumer (colorizeIntent/colorizeTracking/colorizeStamp/colorizeLine,
  NOTICE_COLORS as getters, selectedOpen/selectedClose and the slash-bar border, the input
  hint, the brand mark, the modal border) reads the live value at paint time. The
  transcript colours at paint time: renderTranscriptLines() (app/tui-render.js) renders the
  markdown and the tool delimiters without the palette, and the transcript view
  (app/transcript-view.js) applies colorizeLine() to each stored row on every paint, so a
  skin repaints the conversation that is already on screen instead of only the chrome and
  the rows written afterwards; a block body carries its one colour (bodyColor) beside the
  payload rather than inside it and is re-wrapped on every paint. The two prose background
  bands (userBg/assistantBg) are live skin tokens too: PROSE_BACKGROUNDS lives in
  app/band-palette.js, setTokens() mutates it in place, and app/prose-band.js reads it at
  paint time, so a request for a *background* reaches the screen — its absence was the
  reported "it saved but nothing changed". The
  /skins command (app/skins-command.js) lists, applies, saves, resets and builds a look
  from key=value tokens; /skins prompt <request> reaches a modal subchat
  (app/skin-prompt.js + app/skin-modal.js) where one injected model call proposes a skin
  that the user confirms (apply / apply-and-save / cancel) before the command moves any
  state, and whose waiting state is live while the call is in flight (a spinner frame and
  climbing elapsed seconds, driven by an unref'd timer). The modal box is sized to the
  live terminal rather than to a percentage of it, and its body is fitted to the box
  with the actions, the request, the name and the hint reserved — the preview is what
  gets cut when the box is small — so the action list is never clipped off the bottom
  of the box, and a resize refits both the box and the body. The modal owns the
  keyboard through a lease (app/keyboard-ownership.js): the host stands down for
  Escape and Tab while a modal holds it, so Escape cancels the modal without aborting
  the turn and Tab moves the modal focus without cycling the session mode. The system
  text names every
  palette key, every token and both bands, and says a background request means userBg or
  assistantBg, so the model is never left inventing a key. The request is answered from the
  live profile (the colours on screen), not the file, so a customize request changes only
  what the user asked and keeps the rest. /skins customize <request> opens
  the same box in update mode: the model adjusts the skin already in force rather than
  proposing a new one, the name is settled so there is no name field, and the change is
  written over the active skin's own file — it never creates a skin and never moves the
  project default. main.js applies the project's active skin before the screen is built,
  so the first frame already wears it.
