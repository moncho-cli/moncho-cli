    symbols: [parseSkinsArgs, formatSkinLines, skinsCommand, removeSkin]
  - path: app/skins-prompt-action.js
    symbols: [runSkinPrompt, runSkinCustomize]
  - path: app/skin-host.js
    symbols: [applyProjectSkin, currentSkin, rememberAppliedSkin, restoreSessionSkin]
  - path: app/skin-prompt.js
    symbols: [SKIN_COLOR_KEYS, skinSystemPrompt, skinCustomizeSystemPrompt, skinUserPrompt, buildSkinMessages, parseSkinProposal, mergeProposal, validateProposal, createSkinProposer, isDefaultSkin]
