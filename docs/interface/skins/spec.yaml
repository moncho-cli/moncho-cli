    symbols: [CONVERSATION_COLORS, SLASH_COLORS, THEME_TOKENS, DEFAULT_CONVERSATION_COLORS, activePalette, activeTokens, setPalette, setTokens, applySkin, resetTheme, colorizeIntent, colorizeTracking, colorizeStamp, colorizeLine]
