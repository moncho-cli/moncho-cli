  - path: utils/skins-store.js
    symbols: [SKINS_DIR, ACTIVE_FILE, PALETTE_KEYS, PRESENTATION_KEYS, SKIN_KEYS, SKIN_NAME_RE, isColorName, DEFAULT_PALETTE, DEFAULT_PRESENTATION, DEFAULT_SKIN_NAME, DEFAULT_SKIN, normalizeSkin, slugName, skinPath, listSkinPaths, listSkins, readSkin, saveSkin, deleteSkin, readActiveName, writeActiveName]
  - path: utils/color-names.js
    symbols: [BLESSED_COLORS, isColorName]
  - path: app/paint-tags.js
    symbols: [FALLBACK_COLOR, fgTag, fgOpen, fgClose, hasSymbolicTags, resolveTags, stripSymbolicTags, symbolicTag]
  - path: app/theme-palette.js
    symbols: [USER_ECHO_HEADER, CONVERSATION_COLORS, SLASH_COLORS, THEME_TOKENS, INTENT_COLOR, INTENT_BOLD, TRACKING_COLOR, TRACKING_BOLD, STAMP_COLOR, REFUSAL_COLOR, REFUSAL_BOLD, DEFAULT_CONVERSATION_COLORS, isColorName, activePalette, activeTokens, setPalette, setTokens, applySkin, resetTheme, colorizeIntent, colorizeTracking, colorizeRefusal, colorizeStamp]
