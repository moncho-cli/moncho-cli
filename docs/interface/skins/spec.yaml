tests:
  - path: tests/skins-store.test.js
    cases:
      - "the store names the skin shape and keeps the shipped palette as the default"
      - "normalizeSkin() fills defaults, drops invented keys and rejects a hex colour"
      - "isColorName() accepts only the names a blessed tag really paints"
      - "saveSkin() writes one JSON file per name and listSkins() reports it"
      - "the active skin is remembered in agent/skins/active.json, and a corrupt record falls back"
  - path: tests/skins.test.js
    cases:
      - "a bright or light name paints as a background too, so a background token takes it"
      - "the palette and the tokens are live: setPalette/applySkin/resetTheme move them in place"
      - "applying a skin repaints the conversation already on screen"
      - "a skin moves the tool rows: the kind colour is live, the families are not"
      - "a skin moves the prose band backgrounds, and the band follows the live palette"
      - "a repaint records the live profile, so a band that did not move is diagnosable"
  - path: tests/skins-colors.test.js
    cases:
      - "every blessed colour name resolves as a background, through a real widget"
      - "a bright background is the bright escape, not the base one"
      - "the background vocabulary is the same set as the foreground one"
      - "the tag layer builds a background tag for a bright name"
      - "the terminal capability says what the screen will really show"
  - path: tests/skins-background-command.test.js
    cases:
      - "/skins accepts the two prose band tokens, so a background request reaches the screen"
      - "/skins takes a bright background, and refuses only a colour blessed cannot paint"
      - "a bright background reaches the real screen cells, through the real command"
      - "the real /skins command repaints a live transcript, bands included, exactly as the loop wires it"
      - "applying a skin records the live profile — the bands included — in the operational log"
  - path: tests/skins-paint.test.js
    cases:
      - "the slash bar, the notice rows and the input hint read the live palette"
      - "the tag layer resolves a palette key to the live colour, and never leaks a symbol"
      - "the renderer emits symbolic tags, so a skin moves a fence, a table frame and a quote"
  - path: tests/skins-command.test.js
    cases:
      - "parseSkinsArgs() splits list, reset, save, prompt, apply and build-and-save"
      - "/skins lists the skins and flags the active one"
      - "/skins <name> applies a skin and remembers it, and refuses an unknown one"
      - "/skins builds a new look from tokens and writes it down with save"
      - "/skins builds a look under a new name without writing it down"
      - "/skins reset restores the shipped default"
      - "/skins names the value it refused, and the colours it will take"
      - "/skins save puts the skin on and makes it the project default, so the UI changes at once"
      - "/skins prompt refuses without a subchat and applies the confirmed proposal"
      - "/skins customize updates the active skin in place and never creates a new one"
      - "/skins customize refuses without a request or without a subchat"
      - "/skins prompt always writes the applied skin, and only \"apply and save\" makes it the default"
  - path: tests/skin-host.test.js
    cases:
      - "applyProjectSkin() applies the stored active skin and returns it"
      - "applyProjectSkin() with no stored skin opens in the built-in default and still bootstraps"
      - "rememberAppliedSkin() writes the applied skin as the project default and repaints"
      - "restoreSessionSkin() is refused before the bootstrap and applies the file after it"
      - "a stored skin whose band blessed cannot paint is named in the log when it is applied"
  - path: tests/skins-prompt.test.js
    cases:
      - "parseSkinProposal() finds the JSON in a chatty answer and rejects a non-object"
      - "mergeProposal() keeps the base for what the proposal did not name"
      - "the system prompts name every key a skin can move, the two bands and the chrome included"
      - "validateProposal() accepts the two band tokens, and refuses an unpaintable one"
      - "mergeProposal() moves the prose band a proposal named and keeps the one it did not"
      - "liveProfile() is the look on screen, not the file, so customize adjusts what the user sees"
      - "validateProposal() refuses an invalid colour, an unknown key and a bad boolean"
      - "createSkinProposer() refuses an invalid proposal instead of applying the default"
      - "createSkinProposer() answers a skin from an injected model call, and null from junk"
      - "createSkinProposer() in customize mode asks for the change and keeps the base name"
  - path: tests/skins-modal.test.js
    cases:
      - "openSkinModal() offers only Cancel while the skin is being prepared"
      - "openSkinModal() shows the proposal with an editable name and resolves the edited choice"
      - "the name in the field is the name the skin is saved under"
      - "the apply actions are unavailable while the name is unusable"
      - "openSkinModal() in customize mode offers only the update action and no name field"
      - "formatSkinPreview() wraps a long palette on the colour boundaries"
      - "the waiting state is live: the frame moves and the seconds climb while the call runs"
  - path: tests/skins-modal-keys.test.js
    cases:
      - "the arrow keys move the action cursor from the name field, and take the focus with them"
      - "openSkinModal() moves the cursor and the focus on an arrow, so Enter applies what is highlighted"
      - "the cursor is clamped to the actions offered, so a shrinking list never loses the highlight"
  - path: tests/skins-modal-layout.test.js
    cases:
      - "the box is sized to the terminal, and never wider or taller than it"
      - "the actions are reserved, and the preview is what gets cut"
      - "a row is cut to the width, between graphemes, and its tags are closed"
      - "the actions are on the screen, at every terminal size"
      - "a resize refits the box and the body to the new terminal"
      - "the modal owns the keyboard, and the host stands down for it"
      - "a lease is released at the end of the event, not in the middle of it"
      - "two screens hold their own keyboard leases"
  - path: tests/skins-modal-screen.test.js
    cases:
      - "real arrow bytes move the cursor, and the marked row on the screen moves with it"
      - "the actions are on the rendered screen, and the terminal never saw them clipped"
      - "a real Escape byte cancels the modal without interrupting the turn"
      - "a real Tab byte moves the modal focus and does not cycle the session mode"
      - "the real typed characters land in the name field, once each"
