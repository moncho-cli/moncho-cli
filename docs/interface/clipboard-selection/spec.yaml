id: interface/clipboard-selection
domain: interface
title: Selecting text in the conversation and saving it to a file on release
status: active
summary: >
  The conversation lets the reader drag over text and release to keep it. app/transcript-select.js
  owns the gesture: a press anchors, a repeat press extends the focus, a release finishes it,
  and the text between the two points is read out of the model's own rows. A drag arrives as
  repeated mousedown reports rather than mousemove, because neo-blessed's decoder recognises
  motion only from the no-button report codes; a gesture therefore extends on each press
  instead of re-anchoring. A release that never moved is a click, not a selection, so the plain
  click still toggles a block. app/transcript-highlight.js paints the band so the reader sees
  exactly what will be saved. On release, app/clipboard-file.js writes the text to a
  time-stamped file in the workspace — .moncho.clipboard.hhmmss, one per copy, never
  overwritten — and app/toast.js raises a four-second toast naming the file. The file is the
  delivery mechanism because a program inside a container cannot reach the host's clipboard: a
  native tool needs a display server the container does not have, and an OSC 52 escape sequence
  leaves the container as output that the host terminal may or may not honour. A file in the
  workspace is the one medium that works without a display server, and the reader can open it
  wherever they are. The saved file is gitignored, both in this repository and in a project's
  local git excludes. How many files a copy leaves behind is one knob, CLIPBOARD_FILE_KEEP:
  `single` (the default) prunes the earlier clipboard files so exactly the last selection
  remains, and `all` keeps every copy under its own timestamped name. The name still changes
  with the clock in both modes, because the host watcher picks a selection up when a new name
  appears; pruning is best-effort, prefix-scoped and runs only after a write has landed, so a
  failed copy leaves the previous selection untouched and an ordinary file is never removed.
  The runner that starts the container runs on the host, where the clipboard actually lives,
  so bin/lib/clipboard-watch.sh watches the workspace and feeds each new selection to the
  host's own tool (pbcopy on macOS, clip.exe on WSL, wl-copy on Wayland, xclip or xsel on X11).
  It is started and stopped with the container — a foreground run ends it when the container
  returns, a detached start leaves it for stop to end by way of a pidfile — and it stays
  silent because the TUI owns the terminal. It never re-copies a file that was already there
  when it started, so launching the agent cannot clobber the clipboard with an old selection,
  and it hands a file over only once its size has held for a full poll, so a write still in
  progress is never read half finished.
code:
  - path: app/transcript-select.js
    symbols: [normalizePoint, isBefore, isSamePoint, sliceCells, selectionText, contentRows, pointAt, createTextSelection]
  - path: app/transcript-highlight.js
    symbols: [wrapWidthOf, SELECTION_TAG_OPEN, SELECTION_TAG_CLOSE, highlightCells, selectionRange, lineCellRange, highlightRows]
  - path: app/transcript-mouse.js
    symbols: [bindSelectionGestures]
  - path: app/clipboard-file.js
    symbols: [CLIPBOARD_FILE_PREFIX, CLIPBOARD_FILE_GLOB, CLIPBOARD_MAX_ATTEMPTS, clipboardFileName, createClipboardFile]
  - path: config/constants.js
    symbols: [CLIPBOARD_FILE_KEEP, normalizeClipboardKeep]
  - path: app/toast.js
    symbols: [TOAST_TTL_MS, TOAST_MAX_CHARS, savedToastText, SAVED_TOAST_TEXT, formatToastText, createToast]
  - path: app/tui-toast.js
    symbols: [createToastBar]
  - path: app/tui-clipboard.js
    symbols: [createSelectionClipboard]
  - path: app/tui-transcript.js
    symbols: [createTranscriptPane]
  - path: app/transcript-view.js
    symbols: [createTranscriptView]
  - path: app/tui-surface.js
    symbols: [createTuiSurface]
  - path: app/transcript-geometry.js
    symbols: [contentOrigin, scrollBase, scrollOffset, visibleHeight, scrollHeight, drawnRows, drawnWidth, wrapWidthOf, contentPoint]
  - path: app/cell-width.js
    symbols: [graphemes, graphemeWidth]
tests:
  - path: tests/clipboard-file.test.js
    cases:
      - "clipboardFileName() names the file with the local time, zero-padded"
      - "normalizeClipboardKeep() defaults to a single file and accepts the aliases"
      - "the selection is written to the workspace under its time name"
      - "single mode leaves exactly one file, the last copy"
      - "single mode never touches a file that is not a clipboard file"
      - "all mode keeps a timestamped history, and never overwrites one copy with another"
      - "an empty selection is not a file, and a failure is reported not thrown"
      - "a failed copy leaves the previous selection untouched in single mode"
  - path: tests/clipboard-selection.test.js
    cases:
      - "sliceCells() takes whole clusters and never cuts a wide glyph in half"
      - "selectionText() normalises the drag, joins the rows and drops the band padding"
      - "pointAt() maps a mouse event onto a content point through the widget geometry"
      - "createTextSelection() copies on the release, so a drag with no motion still copies"
      - "finish() clears the selection and repaints, copied or not"
      - "a drag that moves copies on whichever edge finishes it first"
      - "a second press extends the gesture instead of restarting it"
      - "cancel() drops a gesture without copying, and clears the band"
  - path: tests/clipboard-highlight.test.js
    cases:
      - "highlightCells() marks exactly the selected cells through the line's own tags"
      - "lineCellRange() maps a wrapped-row range onto one display line"
      - "highlightRows() reads blessed's own row table and leaves other lines untouched"
  - path: tests/clipboard-selection-tui.test.js
    cases:
      - "a release saves the selection and a plain click still toggles a block"
      - "a drag saves the line it started on, not the one below it"
      - "the copy is confirmed in the top-right toast and never enters the conversation"
  - path: tests/clipboard-mouse-wire.test.js
    cases:
      - "a drag as a terminal sends it saves what was dragged over, exactly once"
      - "the band follows a drag that arrives as repeated presses, and clears on release"
      - "a pointer moving with no button held selects nothing"
      - "a release outside the transcript still finishes the gesture, and a drag over the edge saves to the end"
      - "a press outside the pane never starts a selection"
  - path: tests/clipboard-watch.test.js
    cases:
      - "pick_clipboard_tool() chooses the host tool by platform and display"
      - "the watcher copies a new selection to the host clipboard, exactly once"
      - "the last copy wins, and a file still being written is not copied half way"
      - "a file that is not a clipboard file is left alone"
      - "a watcher does not copy a selection that was already there when it started"
      - "the watcher starts only where a clipboard tool exists, and stop is idempotent"
  - path: tests/toast.test.js
    cases:
      - "the copy toast says the plain sentence and lives for four seconds"
      - "the sentence names the file the selection was saved to"
      - "a second copy replaces the first and restarts its four seconds"
      - "a blank message is not a toast, and a long one is fitted to the box"
      - "subscribe() reports the sentence, and close() stops the reports"
  - path: tests/tui-toast.test.js
    cases:
      - "the toast box appears with its message and hides itself on a timer"
      - "the four-second default is what a copy actually gets"
      - "the toast box is top-right and only as wide as its sentence"
      - "a copy raises the confirmation and the provider overlay is not used for it"
